<div class="-mx-6 -mb-6">   <!-- Pull back the contents to the edges of the dialog (p-dialog applies padding to inner elements)-->
  <!-- Header Section with Gradient & Icon (matching login card header) -->
  <div class="flex flex-col items-center pt-8 px-6 bg-gradient-to-br from-orange-500 to-amber-500">
    <div class="w-16 h-16 sm:w-24 sm:h-24 bg-white rounded-full flex items-center justify-center shadow-lg mb-4">
      <i class="pi pi-lock text-orange-500 text-xl sm:text-4xl"></i>
    </div>
    <h2 class="text-2xl font-bold text-white mb-2">Reset Password</h2>
    <p class="text-orange-50 text-center text-sm px-4">
      Enter your email address to reset your password
    </p>
  </div>

  <!-- Form Content (matching login card body padding) -->
  <div class="p-8 bg-white">
    <form [formGroup]="resetForm" (ngSubmit)="onResetPassword()" class="flex flex-col gap-6">
      <!-- Email Input -->
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-semibold text-gray-700">
          Email Address
        </label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-envelope text-gray-400"></i>
          <input pInputText
                 id="email"
                 name="email"
                 type="email"
                 formControlName="email"
                 autocomplete="off"
                 placeholder="you@example.com"
                 class="p-inputtext-vetflow w-full pl-10 pr-4 py-3 rounded-lg border-2 border-gray-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition-all duration-200" />
        </span>
        @if (this.email?.invalid && (this.email?.touched || this.email?.dirty)) {
        <div>
          @if(email?.hasError('required')) {
          <p-message severity="error"
                     text="Email is required"
                     styleClass="text-xs"></p-message>
          }

          @if(email?.hasError('email')) {
          <p-message severity="error"
                     text="Invalid email format"
                     styleClass="text-xs"></p-message>
          }
        </div>
        }
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between gap-3 pt-2">
        <p-button type="button"
                  label="Cancel"
                  severity="secondary"
                  [outlined]="true"
                  (onClick)="onCancel()"
                  styleClass="flex-1 justify-center py-2.5 border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg transition-all duration-200">
        </p-button>

        <p-button type="submit"
                  label="Reset Password"
                  icon="pi pi-send"
                  [loading]="isLoading"
                  [disabled]="resetForm.invalid || isLoading"
                  styleClass="flex-1 justify-center py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all duration-200">
        </p-button>
      </div>
    </form>
  </div>
</div>
